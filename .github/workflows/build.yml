name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [wifi, eth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: esphome compile solarbeam-din-module-${{ matrix.variant }}.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: solarbeam-din-module-${{ matrix.variant }}
          path: .esphome/build/solarbeam-din-module/build/firmware.factory.bin
          if-no-files-found: error
